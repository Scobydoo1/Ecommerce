name: ecommerce-dev

services:
  postgres:
    # Image chinh chu pgvector, da co san extension vector; pg_trgm va unaccent
    # nam san trong contrib cua Postgres 16.
    image: pgvector/pgvector:pg16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      # Doc tu .env, co gia tri mac dinh de `docker compose up` chay ngay sau khi
      # clone. Doi mat khau thi sua .env, khong sua file nay - de mat khau that
      # khong bao gio nam trong git.
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      # Chi mo tren loopback: khong de Postgres lo ra mang LAN hay Internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
